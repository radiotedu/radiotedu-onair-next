name: Isolated Windows service image swap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-swap:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - run: dotnet restore OnAirNext.slnx --locked-mode --disable-parallel -m:1
      - run: dotnet build OnAirNext.slnx -c Release --no-restore -m:1 /p:UseSharedCompilation=false /p:BuildInParallel=false
      - name: Verify stopped service image can move
        run: ./scripts/Test-WindowsService.ps1 -BuildRoot "$env:LOCALAPPDATA/RadioTEDU/OnAirNext-Dev/build/bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-service-image-swap
          path: artifacts/service-smoke/summary.json
          if-no-files-found: warn
