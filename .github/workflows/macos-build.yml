name: macOS engine and setup qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '2'
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Build portable host and console
        run: |
          dotnet restore OnAirNext.slnx --locked-mode --disable-parallel
          dotnet build OnAirNext.slnx -c Release --no-restore -m:1 /p:UseSharedCompilation=false
      - name: Run microphone transport and portable audio domain tests
        run: dotnet test tests/OnAirNext.Tests/OnAirNext.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~MicrophoneTransportTests|FullyQualifiedName~EngineTests|FullyQualifiedName~StationLibraryTests' --logger trx --results-directory artifacts/macos-tests
      - name: Restore pinned codec cache
        id: codecs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/macos-codec-runtime
          key: macos-codecs-${{ matrix.rid }}-${{ hashFiles('scripts/codec/build-macos-codecs.py','scripts/codec/build-windows-codecs.py','scripts/codec/windows-codec.lock.json') }}
      - name: Install build tools and loopback origin
        run: brew install autoconf automake libtool nasm pkg-config icecast
      - name: Build pinned shared audio runtime
        if: steps.codecs.outputs.cache-hit != 'true'
        run: python3 scripts/codec/build-macos-codecs.py
      - name: Qualify continuous audio, microphone fallback and reconnect on private Icecast
        run: |
          for scenario in baseline live recovery; do
            dotnet artifacts/build/bin/OnAirNext.Lab/release/OnAirNext.Lab.dll --ffmpeg "$PWD/artifacts/macos-codec-runtime/bin/ffmpeg" --dotnet "$(command -v dotnet)" --icecast-root "$(brew --prefix icecast)" --scenario "$scenario" --duration-seconds 12
          done
      - name: Build complete native application and macOS setup
        run: python3 scripts/Package-MacOS.py ${{ matrix.rid }}
      - name: Install on disposable Mac and verify real operator UI
        run: |
          sudo installer -pkg "artifacts/installers/RadioTEDU-OnAir-Next-${{ matrix.rid }}-Setup.pkg" -target /
          desktop-shell/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron desktop-shell/test/operator-e2e.cjs
      - name: Retain native macOS setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onair-next-setup-${{ matrix.rid }}
          path: artifacts/installers/RadioTEDU-OnAir-Next-*-Setup.pkg
          if-no-files-found: error
      - name: Retain native runtime and sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-runtime-${{ matrix.rid }}
          path: artifacts/macos-codec-runtime
      - name: Retain qualification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-evidence-${{ matrix.rid }}
          path: |
            artifacts/macos-tests
            artifacts/operator-ui
          if-no-files-found: warn
